<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta property="og:title" content="Kosen Todo / Dashboard" />
        <meta property="og:description" content="高専生のためのタスク管理アプリ" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://todo.kyonshi.com/dashboard" />
        <meta property="og:image" content="https://todo.kyonshi.com/res/img/banner.png" />
        <meta property="og:site_name" content="Kosen Todo" />
        <meta name="twitter:card" content="summary_large_image" />

        <link rel="stylesheet" href="/css/colors.css" />
        <link rel="stylesheet" href="/css/common.css" />
        <link rel="stylesheet" href="/css/dashboard.css" />
        <link rel="stylesheet" href="/css/calender.css" />
        <link rel="stylesheet" href="/css/sidebar.css" />
        <link rel="stylesheet" href="/css/freetime.css" />
        <link rel="stylesheet" href="/css/auth-guard.css" />
        <title>Kosen todo</title>
        <script src="/js/preload.js" type="module"></script>
        <script src="/js/user-info.js" type="module"></script>
        <script src="/js/auth-guard.js" type="module"></script>
        <script src="/js/sidebar.js" type="module"></script>
        <script src="/js/dashboard.js" type="module"></script>
        <script src="/js/freetime.js" type="module"></script>
        <script src="/js/todo.js" type="module"></script>
    </head>
    <body>
        <div class="main-container">
        <!-- application移動-->
        <section class="app-menu">
            <button class="app-icon app-add"><div></div></button>
        </section>
        <!--メイン部分-->
        <main>
            <!--　カレンダー　-->
            <section class="calendar">
                <div class="calender-header">
                    <div class="calender-year">
                        <div class="year-month">
                        <h2 id="month-title">12</h2>
                        <div class="sub-title">
                            <h2 id="year-title">2024</h2>
                            <h2 id="month-name">December</h2>
                        </div>
                    </div>
                    <div class="calender-header-button">
                        <button id="prev">◀</button>
                        <button id="next">▶</button>
                    </div>
                    <div class="overview">
                        <hr>
                        <ul>
                            <li id="plan-li">
                                予定:
                                <div id="plan"> 0</div>
                            </li>
                            <li id="task-li">
                                タスク:
                                <div id="task"> 0</div>
                            </li>
                        </ul>
                        <hr>
                    </div>
                    </div>
                    </div>
                <div class="calender-container">
                    <div class="week">
                        <div>日</div>
                        <div>月</div>
                        <div>火</div>
                        <div>水</div>
                        <div>木</div>
                        <div>金</div>
                        <div>土</div>
                    </div>
                    <hr>
                    <div class="days">
                    <!-- 日付　-->
                    </div>
                </div>
            </section>
            <!--<section class="commands">
                <div class="command-item"><button class="command-button" type="button">スケジュールツリー</button></div>
                <div class="command-item"><button class="command-button" type="button">空き時間検索</button></div>
                <div class="command-item"><button class="command-button" type="button">ToDoリスト</button></div>
            </section>-->
        <div class="popup">
            <div id="day-view-modal" class="modal day-view-popup">
                <div class="day-view-content">
                    <div class="day-view-header">
                        <h4 id="day-view-title"></h4>
                        <div class="day-view-header-buttons">
                            <button id="day-view-add">+ 予定を追加</button>
                            <button id="day-view-close">✖</button>
                        </div>
                    </div>
                    <div class="day-view-body">
                        <div class="day-view-hours" id="day-view-hours"></div>
                        <div class="day-view-events" id="day-view-events"></div>
                    </div>
                </div>
            </div>
            <div id="schedule-modal" class="modal">
                <div class="modal-content">
                    <!-- ドラッグ用 -->
                    <div id="modal-header" class="modal-header">
                        <h4 id="showDay"></h4>
                    </div>
                    <div class="time-input">
                        <input type="time" id="start-time">
                        <span>～</span>
                        <input type="time" id="end-time">
                    </div>
                    <textarea id="schedule-title" placeholder="タイトルを入力..."></textarea>
                    <label><input type = "radio" name = "schedule-type"  value="task" id="radio-task">タスク</label>
                    <label><input type = "radio" name = "schedule-type"  value="plan" id="radio-plan">予定</label>
                    <br><br>
                    <label><input type = "checkbox" name = "schedule-hidden">予定の内容を公開しない</label>

                    <div class="modal-buttons">
                        <button id="schedule-ok">入力</button>
                        <button id="schedule-cancel">キャンセル</button>
                    </div>
                </div>
            </div>
        </div>
        </main>
        </div>
        <sidebar>
            <div class="tab-control">
                <div class="tab-background"></div>
                <button class="tab active" data-target="todo-content">ToDoリスト</button>
                <button class="tab" data-target="freetime-content">空き時間検索</button>
                <button class ="tab" data-target="TimeScheduleTree-content">タイムスケジュール</button>
            </div>
            <div class="tab-contents">
                <div id="todo-content" class="tab-pane active">
                    <div id="sidebar-day-view-slot"></div>
                </div>
                <div id="freetime-content" class="tab-pane">
                    <div class="freetime-input">
                        <div class="freetime-field">
                            <label for="freetime-start">開始</label>
                            <input type="datetime-local" id="freetime-start">
                        </div>
                        <span class="freetime-tilde">～</span>
                        <div class="freetime-field">
                            <label for="freetime-end">終了</label>
                            <input type="datetime-local" id="freetime-end">
                        </div>
                    </div>

                    <div class="freetime-members-section">
                        <h4 class="freetime-section-title">対象メンバー</h4>
                        <div class="members">
                            
                        </div>
                    </div>

                    <button class="freetime-search">
                        <span class="freetime-search-icon">🔍</span>空き時間を検索
                    </button>

                    <hr class="freetime-divider">

                    <div id="freebusy-results">
                        
                    </div>
                </div>
                <div id="TimeScheduleTree-content" class="tab-pane">
                    <!-- ① グループ選択画面 -->
                    <div id="group-select-view" class="group-select-view">
                        <div class="ts-title">
                            <span>
                                <h4 id="group-select-font">グループ選択</h4>
                                <button id="group-add-btn">＋ 新規追加</button>
                                <button id="group-edit-btn" title="修正">✎</button>      <!-- ← 追加 -->
                                <button id="group-delete-btn" title="削除">🗑</button>    <!-- ← 追加 -->
                            </span>
                        </div>
                        <div id="group-mode-bar" class="group-mode-bar" style="display:none;">
                            <span id="group-mode-note"></span>
                            <button id="group-mode-cancel">キャンセル</button>
                            <button id="group-mode-submit">削除</button>   <!-- 削除モードのときだけ表示 -->
                        </div>
                        <div id="group-list" class="group-list"></div>
                    </div>
                    <!-- ② グループ詳細画面(上:共有カレンダー / 下:メンバー一覧) -->
                    <div id="group-detail-view" class="group-detail-view">
                        <div class="ts-header">
                            <button id="group-back-btn">◀ 戻る</button>
                            <h4 id="group-detail-title"></h4>
                        </div>
                        <!-- カレンダーを別途で作成 -->
                        <div class="mini-calender">
                            <div class="mini-cal-header">
                                <div class="mini-cal-year">
                                    <div class="mini-year-month">
                                        <h2 id="mini-month-title">12</h2>
                                        <div class="mini-sub-title">
                                            <h2 id="mini-year-title">2024</h2>
                                            <h2 id="mini-month-name">December</h2>
                                        </div>
                                    </div>
                                </div>
                                <button id="mini-cal-prev">◀</button>
                                <span id="mini-cal-month-label"></span>
                                <button id="mini-cal-next">▶</button>
                            </div>
                            <div class="mini-cal-week">
                                <div>日</div>
                                <div>月</div>
                                <div>火</div>
                                <div>水</div>
                                <div>木</div>
                                <div>金</div>
                                <div>土</div>
                            </div>
                            <div class="mini-cal-days"></div>
                            <div class="group-members" id="group-members"></div>
                        </div>
                    </div>
                    <!-- ③ メンバー詳細画面(その人のカレンダー) -->
                    <div id="member-detail-view" class="member-detail-view" style="display:none;">
                        <div class="ts-header">
                            <button id="member-back-btn">◀ 戻る</button>
                            <h4 id="member-detail-title"></h4>
                        </div>
                        <div id="member-detail-cal" class="member-detail-cal">
                            <div class="mini-member-cal-header">
                                <div class="member-cal-year">
                                    <div class="member-year-month">
                                        <h2 id="member-month-title">12</h2>
                                        <div class="member-sub-title">
                                            <h2 id="member-year-title">2024</h2>
                                            <h2 id="member-month-name">December</h2>
                                        </div>
                                    </div>
                                </div>
                                <div class="member-cal-btn" id="member-cal-btn">
                                    <button id="mini-member-cal-prev">◀</button>
                                    <span id="mini-member-cal-month-label"></span>
                                    <button id="mini-member-cal-next">▶</button>
                                </div>
                            </div>
                            <div class="mini-member-cal-week">
                                <div>日</div>
                                <div>月</div>
                                <div>火</div>
                                <div>水</div>
                                <div>木</div>
                                <div>金</div>
                                <div>土</div>
                            </div>
                            <div class="mini-member-cal-days"></div>
                        </div>
                    </div>
                    <!-- ④ 新規追加画面 -->
                    <div id="group-add-view" class="group-add-view" style="display:none;">
                        <div class="ts-header">
                            <button id="group-add-back-btn">◀ 戻る</button>
                            <h4 id="group-add-title">新規追加</h4>
                        </div>
                        <p id="group-add-note" class="group-add-note">新規追加する人を以下から選んでください</p>
                        <!-- 共有カレンダーの名前。グループ選択の一覧に名前が必要なので置いた -->
                        <input type="text" id="group-add-name" placeholder="グループ名を入力...">
                        <!-- 人の一覧(JSが作る。多いとスクロール) -->
                        <div id="group-add-list" class="group-members"></div>
                        <button id="group-add-submit">追加</button>
                    </div>
                </div><!-- /#TimeScheduleTree-content -->
            </div><!-- /.tab-contents  ← 元のコードにあった閉じタグ。ここに移動しただけ -->
            <div class="user-more">
            <div class="profile">
                <img id="user-icon" src="" alt="User Icon" />
                <div class="user-info">
                    <div id="user-name">読み込み中...</div>
                    <div id="user-email"></div>
                </div>
            </div>
            <button class="logout-btn">ログアウト</button>
            </div>
        </sidebar>
        <div class="app-icon-popup">
            <label>名前</label>
            <input type="text" class="app-icon-name">
            <label>リンク</label>
            <input type="text" class="app-icon-link">
            <hr>
            <label>またはアプリを追加...</label>
            <input type="text" list="prefs" class="app-icon-app">
            <datalist id="prefs">
                <option value="discord://">Discord</option>
                <option value="msteams://">Microsoft Teams</option>
                <option value="zoommtg://">Zoom</option>
                <option value="line://">LINE</option>
                <option value="vscode://">Visual Studio Code</option>
                <option value="notion://">Notion</option>
                <option value="x-github-client://">GitHub Desktop</option>
                <option value="spotify://">Spotify</option>
            </datalist>
            <button class="app-icon-submit">追加</button>
        </div>
        <div class="app-icon-context">
            <button class="app-icon-delete">削除</button>
        </div>
    </body>
</html>
