<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Kosen Todo / Dashboard" />
    <meta property="og:description" content="高専生のためのタスク管理アプリ" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://todo.kyonshi.com/dashboard" />
    <meta property="og:image" content="https://todo.kyonshi.com/res/img/banner.png" />
    <meta property="og:site_name" content="Kosen Todo" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="/css/colors.css" />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/calender.css" />
    <link rel="stylesheet" href="/css/sidebar.css" />
    <link rel="stylesheet" href="/css/auth-guard.css" />
    <title>Kosen todo</title>
    <script src="/js/preload.js" defer></script>
    <script src="/js/user-info.js" type="module" defer></script>
    <script src="/js/auth-guard.js" type="module"></script>
    <script src="/js/sidebar.js"></script>
</head>
    <body>
        <div class="main-container">
        <!-- application移動-->
        <section class="app-menu">
            <button class="app-icon app-add"><div></div></button>
        </section>
        <!--メイン部分-->
        <main>
            <!--　カレンダー　-->
            <section class="calendar">
                <div class="calender-header">
                    <div class="calender-year">
                        <div class="year-month">
                        <h2 id="month-title">12</h2>
                        <div class="sub-title">
                            <h2 id="year-title">2024</h2>
                            <h2 id="month-name">December</h2>
                        </div>
                    </div>
                    <div class="calender-header-button">
                        <button id="prev">◀</button>
                        <button id="next">▶</button>
                    </div>
                    <div class="overview">
                        <hr>
                        <ul>
                            <li id="plan-li">
                                予定:
                                <div id="plan"> 0</div>
                            </li>
                            <li id="task-li">
                                タスク:
                                <div id="task"> 0</div>
                            </li>
                        </ul>
                        <hr>
                    </div>
                    </div>
                    </div>
                <div class="calender-container">
                    <div class="week">
                        <div>日</div>
                        <div>月</div>
                        <div>火</div>
                        <div>水</div>
                        <div>木</div>
                        <div>金</div>
                        <div>土</div>
                    </div>
                    <hr>
                    <div class="days">
                    <!-- 日付　-->
                    </div>
                </div>
            </section>
            <!--<section class="commands">
                <div class="command-item"><button class="command-button" type="button">スケジュールツリー</button></div>
                <div class="command-item"><button class="command-button" type="button">空き時間検索</button></div>
                <div class="command-item"><button class="command-button" type="button">ToDoリスト</button></div>
            </section>-->
        <div class="popup">
            <div id="schedule-modal" class="modal">
                <div class="modal-content">

                    <!-- ドラッグ用 -->
                    <div id="modal-header" class="modal-header">
                        <h4 id="showDay"></h4>
                    </div>
                    <div class="time-input">
                        <input type="time" id="start-time">
                        <span>～</span>
                        <input type="time" id="end-time">
                    </div>
                    <textarea id="schedule-title" placeholder="タイトルを入力..."></textarea>
                    <label><input type = "radio" name = "schedule-type"  value="task" id="radio-task">タスク</label>
                    <label><input type = "radio" name = "schedule-type"  value="plan" id="radio-plan">予定</label>

                    <div class="modal-buttons">
                        <button id="schedule-ok">入力</button>
                        <button id="schedule-cancel">キャンセル</button>
                    </div>
                </div>
            </div>
        </div>
        <script src="../js/dashboard.js"></script>
        </main>
        </div>
        <sidebar>
            <div class="tab-control">
                <div class="tab-background"></div>
                <button class="tab active">ToDoリスト</button>
                <button class="tab">空き時間検索</button>
                <button class="tab">共有カレンダー</button>
            </div>
            <hr>
            <div class="profile">
                <img id="user-icon" src="/res/img/default-icon.png" alt="User Icon" />
                <div class="user-info">
                    <div id="user-name">読み込み中...</div>
                    <div id="user-email"></div>
                </div>
            </div>
        </sidebar>
        <div class="app-icon-popup">
            <label>名前</label>
            <input type="text" class="app-icon-name">
            <label>リンク</label>
            <input type="text" class="app-icon-link">
            <hr>
            <label>またはアプリを追加...</label>
            <input type="text" list="prefs" class="app-icon-app">
            <datalist id="prefs">
                <option value="discord://">Discord</option>
                <option value="msteams://">Microsoft Teams</option>
                <option value="zoommtg://">Zoom</option>
                <option value="line://">LINE</option>
                <option value="vscode://">Visual Studio Code</option>
                <option value="notion://">Notion</option>
                <option value="x-github-client://">GitHub Desktop</option>
                <option value="spotify://">Spotify</option>
            </datalist>
            <button class="app-icon-submit">追加</button>
        </div>
        <div class="app-icon-context">
            <button class="app-icon-delete">削除</button>
        </div>
    </body>
</html>
