<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/colors.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <title>Kosen todo</title>
</head>
    <body>
        <!-- application移動-->
        <section class="app-menu">
            <button class="app-icon">📅</button>
            <button class="app-icon">📋</button>
            <button class="app-icon">🔍</button>
            <button class="app-icon">✓</button>
            <button class="app-icon">📝</button>
            <button class="app-icon">📊</button>
            <button class="app-icon">⚙️</button>
            <a href="https://www.youtube.com/" class="app-icon">Y</a>
        </section>

        <div class="background"></div> 

        <!--メイン部分-->
        <main>
            <!--　カレンダー　-->
            <section class="calendar">
                <div class="calender-header">
                    <div class="calender-header-button">
                        <button>◀</button>
                        <button>▶</button>
                    </div>
                    <div class="calender-year">
                        <h2>20xx年 x月のカレンダー</h2>
                    </div>
                    </div>
                    <div class="week">
                        <div>日</div>
                        <div>土</div>
                        <div>月</div>
                        <div>火</div>
                        <div>水</div>
                        <div>木</div>
                        <div>金</div>
                        </div>
                    <div class="days">
                    <!-- 日付　-->

                    <!--  いまはお試しで書いている．jsを書くときに削除する予定  -->
                    <div>1</div>
                    <div>2</div>
                    <div>3</div>
                    <div>4</div>
                    <div>5</div>
                    <div>6</div>
                    <div>7</div>

                    <div>8</div>
                    <div>9</div>
                    <div>10</div>
                    <div>11</div>
                    <div>12</div>
                    <div>13</div>
                    <div>14</div>

                    <div>15</div>
                    <div>16</div>
                    <div>17</div>
                    <div>18</div>
                    <div>19</div>
                    <div>20</div>
                    <div>21</div>

                    <div>22</div>
                    <div>23</div>
                    <div>24</div>
                    <div>25</div>
                    <div>26</div>
                    <div>27</div>
                    <div>28</div>

                    <div>29</div>
                    <div>30</div>
                    <div>31</div>
                </div>
            </section>
            <!-- コマンド -->
            <section class="commands">
                <!-- 今は特に記述なし．一応りょうちゃんが記述する予定としている．-->
            </section>
        </main> 
    </body>
</html>
