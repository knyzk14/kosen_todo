<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/colors.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <title>Kosen todo</title>

    <script src="/js/preload.js" defer></script>
</head>
    <body>
        <!-- application移動-->
        <section class="app-menu">
            <button class="app-icon">📅</button>
            <button class="app-icon">📋</button>
            <button class="app-icon">🔍</button>
            <button class="app-icon">✓</button>
            <button class="app-icon">📝</button>
            <button class="app-icon">📊</button>
            <button class="app-icon">⚙️</button>
            <a href="https://www.youtube.com/" class="app-icon">Y</a>
        </section>

        <!--メイン部分-->
        <main>
            <!--　カレンダー　-->
            <section class="calendar">
                <div class="calender-header">
                    <div class="calender-header-button">
                        <button id="prev">◀</button>
                        <button id="next">▶</button>
                    </div>
                    <div class="calender-year">
                        <h2 id="month-title"></h2>
                    </div>
                    </div>
                    <div class="week">
                        <div>日</div>
                        <div>月</div>
                        <div>火</div>
                        <div>水</div>
                        <div>木</div>
                        <div>金</div>
                        <div>土</div>
                        </div>
                    <div class="days">
                    <!-- 日付　-->
                    
                </div>
            </section>
            <!-- コマンド -->
            <section class="commands">
                <div class="command-item"><button class="command-button" type="button">スケジュールツリー</button></div>
                <div class="command-item"><button class="command-button" type="button">空き時間検索</button></div>
                <div class="command-item"><button class="command-button" type="button">ToDoリスト</button></div>
            </section>
            <script src="../js/dashboard.js"></script>
        </main> 
    </body>
</html>
